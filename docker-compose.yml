services:
    web:
        container_name: web
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - 8080:8080
        volumes:
          - /mnt/sda/anime:/anime
    redis:
        image: redis:latest
        container_name: redis
        ports:
            - '6379:6379'
        volumes:
            - redis-data:/data
        restart: unless-stopped

volumes:
    redis-data:
        driver: local